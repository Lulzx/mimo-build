[package]
name = "mimo-rs"
version = "0.2.11"
edition = "2021"
description = "Reverse-engineered, compile-it-yourself reimplementation of the xAI Mimo Build CLI"
license = "MIT"

[[bin]]
name = "mimo"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
futures-util = "0.3"
walkdir = "2"
glob = "0.3"
regex = "1"
toml = "0.8"
dirs = "5"
rustyline = "14"
shell-words = "1"
ratatui = "0.29"
crossterm = "0.28"
textwrap = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
